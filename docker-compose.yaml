services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      ACCEPT_EULA: ${DB_ACCEPT_EULA}
      MSSQL_PID: ${DB_EDITION}
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_BIND_ADDRESS}:${DB_PORT}:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${MAILPIT_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES}
    ports:
      - "${MAILPIT_BIND_ADDRESS}:${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_BIND_ADDRESS}:${MAILPIT_UI_PORT}:8025"
    volumes:
      - mailpit_data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
  mailpit_data:
